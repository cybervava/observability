[project]
name = "zia-observability"
version = "0.1.0"
description = "Day 5 demo — Observability & Reliability for an LLM classifier (LangSmith, structured logs, behaviour alerts, PII redaction)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-openai",
    "langsmith",
    "pydantic>=2",
    "python-dotenv",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "jupyter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zia_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
